<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Water Traders • Offline</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        max-width: 420px;
        padding: 32px 28px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.75rem;
        color: #004434;
      }
      p {
        margin: 0 0 14px;
        line-height: 1.6;
        color: #334155;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        background: #ecfdf3;
        color: #166534;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.95rem;
      }
      .pill svg {
        width: 18px;
        height: 18px;
      }
    </style>
  </head>
  <body>
    <main class="card" role="main">
      <div class="pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l2.5 4.5L19 9l-3.5 3 1 4.5L12 14.5 7.5 16.5 8.5 12 5 9l4.5-1.5L12 3z" />
        </svg>
        Offline ready
      </div>
      <h1>You're offline</h1>
      <p>
        We couldn't reach Water Traders right now. Content you visited recently may still be available, and we'll refresh everything once you're back online.
      </p>
      <p>
        Please check your connection and try again.
      </p>
    </main>
  </body>
</html>
